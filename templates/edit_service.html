<!DOCTYPE html>
<html>
<head>
    <title>Edit Service</title>
</head>
<body>

<h1>Edit Service</h1>

<form action="/update-service-form/{{ service.id }}" method="POST">

    <input type="text"
           name="title"
           value="{{ service.title }}">

    <br><br>

    <textarea name="description">{{ service.description }}</textarea>

    <br><br>

    <button type="submit">
        Update Service
    </button>

</form>

</body>
</html>
