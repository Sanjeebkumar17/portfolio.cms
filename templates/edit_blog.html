<!DOCTYPE html>
<html>
<head>
    <title>Edit Blog</title>
</head>
<body>

<h1>Edit Blog</h1>

<form action="/update-blog-form/{{ blog.id }}" method="POST">

    <input type="text"
           name="title"
           value="{{ blog.title }}">

    <br><br>

    <textarea name="content">{{ blog.content }}</textarea>

    <br><br>

    <button type="submit">Update Blog</button>

</form>

</body>
</html>
