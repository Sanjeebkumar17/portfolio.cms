<!DOCTYPE html>
<html>
<head>
    <title>Edit Testimonial</title>
</head>
<body>

<h1>Edit Testimonial</h1>

<form action="/update-testimonial-form/{{ testimonial.id }}" method="POST">

    <input type="text"
           name="name"
           value="{{ testimonial.name }}">

    <br><br>

    <textarea name="feedback">{{ testimonial.feedback }}</textarea>

    <br><br>

    <button type="submit">
        Update Testimonial
    </button>

</form>

</body>
</html>
