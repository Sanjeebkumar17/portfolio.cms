<!DOCTYPE html>
<html>
<head>
    <title>Edit Project</title>
</head>
<body>

<h1>Edit Project</h1>

<form action="/update-project-form/{{ project.id }}" method="POST">

    <input type="text"
           name="title"
           value="{{ project.title }}">

    <br><br>

    <textarea name="description">{{ project.description }}</textarea>

    <br><br>

    <button type="submit">
        Update Project
    </button>

</form>

</body>
</html>
